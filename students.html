<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students List - Iyunga Secondary School</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h2>Iyunga Secondary</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="add-student.html">Add Student</a></li>
            <li><a href="students.html">Students List</a></li>
        </ul>
    </nav>

    <section id="page-header">
        <h1>Students List</h1>
    </section>

    <section id="view-student">
        <div class = "search-box">
            <input type="text" id="searchInput" placeholder ="Search by name, ID or class...">
        </div>
        <div class="table-wrapper">
            <table id="studentsTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Student ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Date of Birth</th>
                        <th>Age</th>
                        <th>Class</th>
                        <th>Region</th>
                        <th>District</th>
                        <th>Ward</th>
                        <th>Guardian Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody"></tbody>
            </table>
        </div>
    </section>

    <footer>
        <p>© 2026 Iyunga Secondary School</p>
    </footer>

    <script src="students-list.js"></script>
</body>
</html>
