<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - Iyunga Secondary School</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h2>Iyunga Secondary</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="add-student.html">Add Student</a></li>
            <li><a href="students.html">Students List</a></li>
        </ul>
    </nav>

    <section id="page-header">
        <h1 id="formTitle">Add New Student</h1>
    </section>

    <section id="add-student">
        <form id="student-form">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="e.g Juma Marwa" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="e.g juma@example.com">
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" required>
            </div>
            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" placeholder="e.g 18" required>
            </div>
            <div class="form-group">
                <label for="studentClass">Class</label>
                <select id="studentClass" required>
                    <option value="">--Select Class--</option>
                    <option value="Form 1">Form 1</option>
                    <option value="Form 2">Form 2</option>
                    <option value="Form 3">Form 3</option>
                    <option value="Form 4">Form 4</option>
                </select>
            </div>
            <div class="form-group">
                <label for="country">Country</label>
                <input type="text" id="country" value="Tanzania" required>
            </div>
            <div class="form-group">
                <label for="region">Region</label>
                <input type="text" id="region" placeholder="e.g. Mara" required>
            </div>
            <div class="form-group">
                <label for="district">District</label>
                <input type="text" id="district" placeholder="e.g Tarime" required>
            </div>
            <div class="form-group">
                <label for="ward">Ward</label>
                <input type="text" id="ward" placeholder="e.g. Susuni" required>
            </div>
            <div class="form-group">
                <label for="guardianPhone">Parent/Guardian Phone</label>
                <input type="tel" id="guardianPhone" placeholder="e.g 0755 000 000" required>
            </div>
            <button type="button" id="addBtn">Add Student</button>
        </form>
    </section>

    <footer>
        <p>© 2026 Iyunga Secondary School</p>
    </footer>

    <script src="add-student.js"></script>
</body>
</html>
